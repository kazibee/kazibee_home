name: Deploy Web Agent Dev (Cloudflare)

# The Web Agent serves the Desktop app's renderer bundle from
# agent-dev.kazibee.com. The bundle is NOT committed here: this job clones the
# Desktop at its release-candidate branch, builds the bundle with the
# Desktop's own `build:web-agent` script into apps/agent/renderer, then
# packages and deploys the worker. Re-run via workflow_dispatch to pick up a
# Desktop UI change without a website commit.

on:
  push:
    branches: [release-candidate]
    paths:
      - src/agent/**
      - src/server/**
      - apps/agent/**
      - migrations/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-agent-dev.yml
  workflow_dispatch:

env:
  DESKTOP_REPO: git@github.com:kazibee/kazibee_desktop.git
  DESKTOP_REF: release-candidate

jobs:
  deploy-agent-dev:
    runs-on: self-hosted
    environment: dev
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci

      # Desktop checkout lives OUTSIDE the website tree so its file: deps
      # (../../noego/<name>) resolve to the same sibling layout developers use.
      - name: Checkout Desktop (release-candidate)
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/web-agent-build"
          rm -rf "$root"
          mkdir -p "$root/desktops"
          git clone --quiet --depth 1 --branch "$DESKTOP_REF" "$DESKTOP_REPO" "$root/desktops/demo-assistant"
          echo "DESKTOP_DIR=$root/desktops/demo-assistant" >> "$GITHUB_ENV"
          git -C "$root/desktops/demo-assistant" rev-parse --short HEAD
      - name: Install Desktop dependencies
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - name: Build Web Agent renderer bundle
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm run build:web-agent
        env:
          KAZIBEE_WEB_AGENT_BUNDLE_DIR: ${{ github.workspace }}/apps/agent/renderer
      - name: Verify bundle
        run: |
          test -f apps/agent/renderer/index.html
          ls apps/agent/renderer/assets | grep -q '^web_agent-.*\.js$'

      - name: Build Cloudflare Web Agent worker
        run: npm run agent:build
      - name: "Deploy with wrangler (env: dev)"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          workingDirectory: apps/agent/dist/cloudflare
          environment: dev
          command: deploy --env dev
      - name: "Upload worker secrets (env: dev)"
        uses: cloudflare/wrangler-action@v3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          workingDirectory: apps/agent/dist/cloudflare
          environment: dev
          command: versions list --env dev
          secrets: |
            DATABASE_URL
