name: Deploy Web Agent Dev (Cloudflare)

# The Web Agent serves the Desktop app's renderer bundle from
# agent-dev.kazibee.com. The bundle is NOT committed and NOT built here: the
# Desktop publishes it as @kazibee-internal/web-agent-renderer, pinned to an
# exact version in package.json. This job installs that package, stages the
# renderer with fail-closed manifest/inventory validation
# (scripts/stage-web-agent-renderer.mjs), then packages and deploys the worker.
# Bump the pinned version (package.json + package-lock.json) to pick up a new
# renderer.
#
# Registry auth is job-temporary and scope-only: it lives in a file under
# $RUNNER_TEMP referenced through NPM_CONFIG_USERCONFIG, is removed before any
# wrangler step runs, and is always cleaned up. Worker deploy secrets stay in
# the wrangler-action steps only.

on:
  push:
    branches: [release-candidate]
    paths:
      - src/agent/**
      - src/server/**
      - apps/agent/**
      - migrations/**
      - scripts/stage-web-agent-renderer.mjs
      - package.json
      - package-lock.json
      - .npmrc
      - .github/workflows/deploy-agent-dev.yml
  workflow_dispatch:

jobs:
  deploy-agent-dev:
    runs-on: self-hosted
    environment: dev
    steps:
      - name: Set temporary npm configuration paths
        run: |
          echo "NPM_INTERNAL_AUTH_FILE=$RUNNER_TEMP/npm-internal-auth.npmrc" >> "$GITHUB_ENV"
          echo "NPM_NO_AUTH_FILE=$RUNNER_TEMP/npm-no-auth.npmrc" >> "$GITHUB_ENV"
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gate on internal registry credential
        env:
          KAZIBEE_INTERNAL_NPM_TOKEN: ${{ secrets.KAZIBEE_INTERNAL_NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KAZIBEE_INTERNAL_NPM_TOKEN:-}" ]; then
            echo "::error::KAZIBEE_INTERNAL_NPM_TOKEN is not set for environment 'dev'; cannot install @kazibee-internal/web-agent-renderer"
            exit 1
          fi
      - name: Configure job-temporary npm auth (scope only)
        env:
          KAZIBEE_INTERNAL_NPM_TOKEN: ${{ secrets.KAZIBEE_INTERNAL_NPM_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          rm -f "$NPM_INTERNAL_AUTH_FILE" "$NPM_NO_AUTH_FILE"
          printf '%s\n' \
            '@kazibee-internal:registry=https://registry.kazibee.com/' \
            "//registry.kazibee.com/:_authToken=${KAZIBEE_INTERNAL_NPM_TOKEN}" \
            > "$NPM_INTERNAL_AUTH_FILE"
          : > "$NPM_NO_AUTH_FILE"
          echo "NPM_CONFIG_USERCONFIG=$NPM_INTERNAL_AUTH_FILE" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --no-audit
      - name: Remove registry auth before staging and deploy
        if: always()
        run: |
          set -euo pipefail
          rm -f "$NPM_INTERNAL_AUTH_FILE"
          echo "NPM_CONFIG_USERCONFIG=$NPM_NO_AUTH_FILE" >> "$GITHUB_ENV"

      - name: Stage Web Agent renderer from the installed artifact
        run: npm run agent:stage-renderer
      - name: Verify bundle
        run: |
          test -f apps/agent/renderer/index.html
          ls apps/agent/renderer/assets | grep -q '^web_agent-.*\.js$'

      - name: Build Cloudflare Web Agent worker
        run: npm run agent:build
      - name: "Deploy with wrangler (env: dev)"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          workingDirectory: apps/agent/dist/cloudflare
          environment: dev
          command: deploy --env dev
      - name: "Upload worker secrets (env: dev)"
        uses: cloudflare/wrangler-action@v3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          workingDirectory: apps/agent/dist/cloudflare
          environment: dev
          command: versions list --env dev
          secrets: |
            DATABASE_URL

      - name: Cleanup npm auth files
        if: always()
        run: rm -f "$NPM_INTERNAL_AUTH_FILE" "$NPM_NO_AUTH_FILE"
