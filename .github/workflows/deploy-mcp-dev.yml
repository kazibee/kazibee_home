name: Deploy Dev — MCP Gateway

# Remote Tool MCP worker, dev environment (mcp-dev.kazibee.com). Same
# discipline as deploy-mcp-prod but bound to the dev site worker
# (script_name: kazibee-dev) and the GitHub `dev` environment secrets.
#
# Required configuration (GitHub `dev` environment):
#   CLOUDFLARE_API_TOKEN   — environment secret (Workers deploy, dev)
#   DATABASE_URL           — environment secret: dev Postgres
#   CLOUDFLARE_ACCOUNT_ID  — repository secret

on:
  push:
    branches:
      - release-candidate
    paths:
      - src/mcp/**
      - src/server/**
      - apps/mcp/**
      - migrations/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-mcp-dev.yml
  workflow_dispatch:

concurrency:
  group: deploy-mcp-dev
  cancel-in-progress: false

jobs:
  deploy-mcp-dev:
    runs-on: self-hosted
    environment: dev

    steps:
      - name: Set temporary npm configuration paths
        run: |
          echo "NPM_INTERNAL_AUTH_FILE=$RUNNER_TEMP/npm-internal-auth.npmrc" >> "$GITHUB_ENV"
          echo "NPM_NO_AUTH_FILE=$RUNNER_TEMP/npm-no-auth.npmrc" >> "$GITHUB_ENV"
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gate on internal registry credential
        env:
          KAZIBEE_INTERNAL_NPM_TOKEN: ${{ secrets.KAZIBEE_INTERNAL_NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KAZIBEE_INTERNAL_NPM_TOKEN:-}" ]; then
            echo "::error::KAZIBEE_INTERNAL_NPM_TOKEN is not set for environment 'dev'; cannot install @kazibee-internal/web-agent-renderer"
            exit 1
          fi
      - name: Configure job-temporary npm auth (scope only)
        env:
          KAZIBEE_INTERNAL_NPM_TOKEN: ${{ secrets.KAZIBEE_INTERNAL_NPM_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          rm -f "$NPM_INTERNAL_AUTH_FILE" "$NPM_NO_AUTH_FILE"
          printf '%s\n' \
            '@kazibee-internal:registry=https://registry.kazibee.com/' \
            "//registry.kazibee.com/:_authToken=${KAZIBEE_INTERNAL_NPM_TOKEN}" \
            > "$NPM_INTERNAL_AUTH_FILE"
          : > "$NPM_NO_AUTH_FILE"
          echo "NPM_CONFIG_USERCONFIG=$NPM_INTERNAL_AUTH_FILE" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --no-audit
      - name: Remove registry auth before staging and deploy
        if: always()
        run: |
          set -euo pipefail
          rm -f "$NPM_INTERNAL_AUTH_FILE"
          echo "NPM_CONFIG_USERCONFIG=$NPM_NO_AUTH_FILE" >> "$GITHUB_ENV"


      # Durable Object binding (script_name: kazibee-dev) comes from the
      # `wrangler` fragments in apps/mcp/noego.config.yml.
      - name: Build Cloudflare MCP worker
        run: npm run mcp:build

      # Migrations are NOT run here: they are manual-only via the
      # migrate-db-* workflows (workflow_dispatch). Deploys assume the
      # schema is already in place.

      # Deploy BEFORE uploading secrets (Cloudflare error 10215 otherwise).
      - name: "Deploy with wrangler (env: dev)"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          workingDirectory: apps/mcp/dist/cloudflare
          environment: dev
          command: deploy --env dev

      - name: "Upload worker secrets (env: dev)"
        uses: cloudflare/wrangler-action@v3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          workingDirectory: apps/mcp/dist/cloudflare
          environment: dev
          command: versions list --env dev
          secrets: |
            DATABASE_URL

      - name: Cleanup npm auth files
        if: always()
        run: rm -f "$NPM_INTERNAL_AUTH_FILE" "$NPM_NO_AUTH_FILE"
