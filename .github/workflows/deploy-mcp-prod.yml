name: Deploy MCP Worker Production (Cloudflare)

# Remote Tool MCP worker (mcp.kazibee.com). Built from apps/mcp/noego.config.yml
# with the same artifact discipline as deploy-worker-prod. Backend-only;
# DATABASE_URL is its only worker secret (grant lookups). The
# ExecutorCoordinator Durable Object is owned by the main `kazibee` worker —
# deploy that first when the DO class or its migrations change.
#
# Required configuration (GitHub `production` environment):
#   CLOUDFLARE_API_TOKEN   — environment secret (Workers deploy, prod)
#   DATABASE_URL           — environment secret: prod Postgres, used by the
#                            migrate step and uploaded as a Worker secret
#   CLOUDFLARE_ACCOUNT_ID  — repository secret
#   KAZIBEE_INTERNAL_NPM_TOKEN — read-only registry.kazibee.com token for
#                            @kazibee-internal/* (npm ci). Job-temporary:
#                            written to a $RUNNER_TEMP userconfig, removed
#                            before any wrangler step, always cleaned up.

# Release model: release-candidate pushes deploy dev; release pushes deploy
# production. workflow_dispatch remains for out-of-band deploys.
on:
  push:
    branches:
      - release
    paths:
      - src/mcp/**
      - src/server/**
      - apps/mcp/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-mcp-prod.yml
  workflow_dispatch:

jobs:
  deploy-mcp-production:
    runs-on: self-hosted
    environment: production
    steps:
      # `runner.temp` is a step-level context only; job-level `env` cannot reference it.
      - name: Set temporary npm configuration paths
        run: |
          echo "NPM_INTERNAL_AUTH_FILE=$RUNNER_TEMP/npm-internal-auth.npmrc" >> "$GITHUB_ENV"
          echo "NPM_NO_AUTH_FILE=$RUNNER_TEMP/npm-no-auth.npmrc" >> "$GITHUB_ENV"
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gate on internal registry credential
        env:
          KAZIBEE_INTERNAL_NPM_TOKEN: ${{ secrets.KAZIBEE_INTERNAL_NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KAZIBEE_INTERNAL_NPM_TOKEN:-}" ]; then
            echo "::error::KAZIBEE_INTERNAL_NPM_TOKEN is not set for environment 'production'; cannot install @kazibee-internal/* packages"
            exit 1
          fi

      # Scope-only auth in an isolated userconfig: the public registry stays
      # unauthenticated and the repo .npmrc keeps the scope mapping.
      - name: Configure job-temporary npm auth (scope only)
        env:
          KAZIBEE_INTERNAL_NPM_TOKEN: ${{ secrets.KAZIBEE_INTERNAL_NPM_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          rm -f "$NPM_INTERNAL_AUTH_FILE" "$NPM_NO_AUTH_FILE"
          printf '%s\n' \
            '@kazibee-internal:registry=https://registry.kazibee.com/' \
            "//registry.kazibee.com/:_authToken=${KAZIBEE_INTERNAL_NPM_TOKEN}" \
            > "$NPM_INTERNAL_AUTH_FILE"
          : > "$NPM_NO_AUTH_FILE"
          echo "NPM_CONFIG_USERCONFIG=$NPM_INTERNAL_AUTH_FILE" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Remove registry auth before build and deploy
        if: always()
        run: |
          set -euo pipefail
          rm -f "$NPM_INTERNAL_AUTH_FILE"
          echo "NPM_CONFIG_USERCONFIG=$NPM_NO_AUTH_FILE" >> "$GITHUB_ENV"

      # Durable Object binding (script_name: kazibee) comes from the
      # `wrangler` fragments in apps/mcp/noego.config.yml.
      - name: Build Cloudflare MCP worker
        run: npm run mcp:build

      # Migrations are NOT run here: they are manual-only via the
      # migrate-db-* workflows (workflow_dispatch). Deploys assume the
      # schema is already in place.

      # Deploy BEFORE uploading secrets: Cloudflare rejects secret edits
      # (error 10215) whenever the worker has an uploaded-but-undeployed
      # version. Deploying first clears any version drift, then the secrets
      # step below re-applies DATABASE_URL.
      - name: "Deploy with wrangler (env: production)"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          workingDirectory: apps/mcp/dist/cloudflare
          environment: production
          command: deploy --env production

      # Secret changes on a fully-deployed worker create and deploy a new
      # version automatically, so this lands after the code deploy.
      - name: "Upload worker secrets (env: production)"
        uses: cloudflare/wrangler-action@v3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          workingDirectory: apps/mcp/dist/cloudflare
          environment: production
          command: versions list --env production
          secrets: |
            DATABASE_URL

      - name: Cleanup npm auth files
        if: always()
        run: rm -f "$NPM_INTERNAL_AUTH_FILE" "$NPM_NO_AUTH_FILE"
