name: Deploy MCP Worker Production (Cloudflare)

# Remote Tool MCP worker (mcp.kazibee.com). Built from apps/mcp/noego.config.yml
# with the same artifact discipline as deploy-worker-prod. Backend-only;
# DATABASE_URL is its only worker secret (grant lookups). The
# ExecutorCoordinator Durable Object is owned by the main `kazibee` worker —
# deploy that first when the DO class or its migrations change.
#
# Required configuration (GitHub `production` environment):
#   CLOUDFLARE_API_TOKEN   — environment secret (Workers deploy, prod)
#   DATABASE_URL           — environment secret: prod Postgres, used by the
#                            migrate step and uploaded as a Worker secret
#   CLOUDFLARE_ACCOUNT_ID  — repository secret

# Release model: release-candidate pushes deploy dev; release pushes deploy
# production. workflow_dispatch remains for out-of-band deploys.
on:
  push:
    branches:
      - release
    paths:
      - src/mcp/**
      - src/server/**
      - apps/mcp/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-mcp-prod.yml
  workflow_dispatch:

jobs:
  deploy-mcp-production:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Durable Object binding (script_name: kazibee) comes from the
      # `wrangler` fragments in apps/mcp/noego.config.yml.
      - name: Build Cloudflare MCP worker
        run: npm run mcp:build

      # Migrations are NOT run here: they are manual-only via the
      # migrate-db-* workflows (workflow_dispatch). Deploys assume the
      # schema is already in place.

      # Deploy BEFORE uploading secrets: Cloudflare rejects secret edits
      # (error 10215) whenever the worker has an uploaded-but-undeployed
      # version. Deploying first clears any version drift, then the secrets
      # step below re-applies DATABASE_URL.
      - name: "Deploy with wrangler (env: production)"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          workingDirectory: apps/mcp/dist/cloudflare
          environment: production
          command: deploy --env production

      # Secret changes on a fully-deployed worker create and deploy a new
      # version automatically, so this lands after the code deploy.
      - name: "Upload worker secrets (env: production)"
        uses: cloudflare/wrangler-action@v3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          workingDirectory: apps/mcp/dist/cloudflare
          environment: production
          command: versions list --env production
          secrets: |
            DATABASE_URL
