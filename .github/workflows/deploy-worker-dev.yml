name: Deploy Worker Dev (Cloudflare)

# Same release discipline as deploy.yml (Docker/Node prod): pushing the
# `release` branch deploys; `workflow_dispatch` allows manual deploys
# from any ref. Dev never runs here — local dev is `noego serve` (Node)
# or `wrangler dev` (workerd) against .dev.vars.
#
# RUNNER: self-hosted (all noego/kazibee Actions run on the "simona"
# machine). Framework packages (@noego/app, @noego/dinner, @noego/forge,
# sqlstack) are pinned registry versions in package.json, so a plain
# npm ci is enough — no workspace linking, no NOEGO_MANAGER env needed.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN   — environment secret on `dev` (Workers deploy)
#   CLOUDFLARE_ACCOUNT_ID  — repository secret
#   DATABASE_URL           — environment secret on `dev`: used by the
#                            migrate step (runner must reach the dev
#                            Postgres) and uploaded as a Worker secret

on:
  push:
    branches:
      - release-candidate
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: self-hosted
    # CLOUDFLARE_API_TOKEN lives as an ENVIRONMENT secret (GitHub
    # Environments are the dev/prod boundary): jobs only receive
    # environment secrets when they declare the environment. `dev` for
    # now; a `production` environment (own token + protection rules) can
    # gate the release-branch deploy later.
    environment: dev

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Build Cloudflare worker (SSR pages + API)
        run: npx noego build --target cloudflare --nodejs-compat

      # Migrations are NOT run here: they are manual-only via the
      # migrate-db-* workflows (workflow_dispatch). Deploys assume the
      # schema is already in place.

      # App secrets: SSM (us-east-1, /kazibee_web/dev/...) is the source of
      # truth; scripts/sync-secrets-from-ssm.sh copies them into the GitHub
      # `dev` environment. Deploys read only GitHub secrets — no AWS lookups
      # at deploy time.
      - name: "Deploy with wrangler (env: dev)"
        uses: cloudflare/wrangler-action@v3
        # --env dev on the command selects the [env.dev] wrangler section
        # (worker `kazibee-dev`, dev.kazibee.com); the separate
        # `environment: dev` input scopes the `wrangler secret put` calls
        # so the secrets below land on the dev worker. Never deploy the
        # top-level toml section — it is a placeholder only.
        # Runtime secrets live in the Cloudflare secret store; the action
        # uploads them right after the deploy:
        #   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY -> S3 downloads bucket (kazibee_deploy)
        #   DATABASE_URL -> worker Postgres (environment secret on `dev`)
        #   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET -> environment secrets (synced from SSM)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SWARM_AWS_ACCESS_KEY_ID: ${{ secrets.SWARM_AWS_ACCESS_KEY_ID }}
          SWARM_AWS_SECRET_ACCESS_KEY: ${{ secrets.SWARM_AWS_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dist/cloudflare
          environment: dev
          command: deploy --env dev
          secrets: |
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            SWARM_AWS_ACCESS_KEY_ID
            SWARM_AWS_SECRET_ACCESS_KEY
            DATABASE_URL
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
