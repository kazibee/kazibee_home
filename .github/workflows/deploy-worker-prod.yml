name: Deploy Worker Production (Cloudflare)

# Production deploy of the SAME artifact discipline as deploy-worker.yml
# (dev): build once with `noego build --target cloudflare`, then deploy the
# wrangler [env.production] section (worker `kazibee`, kazibee.com custom
# domain) generated from deploy.cloudflare.environments.production in
# noego.config.yml.
#
# Manual-only (`workflow_dispatch`) until the VM deploy (deploy.yml) is
# retired and prod cutover is verified; then add the `release` push
# trigger and delete deploy.yml.
#
# Requires @noego/app >= 2.1.6 (self-contained [env.<name>] sections in
# the generated wrangler.toml; earlier versions relied on wrangler
# inheritance that does not exist and shipped broken prod deploys).
#
# Required configuration (GitHub `production` environment):
#   CLOUDFLARE_API_TOKEN   — environment secret (Workers deploy, prod)
#   DATABASE_URL           — environment secret: prod Postgres, used by the
#                            migrate step (runner must reach it) and
#                            uploaded as a Worker secret
#   CLOUDFLARE_ACCOUNT_ID  — repository secret (account binding lives in
#                            CI, not in noego.config.yml)
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — repository secrets
#                            (kazibee_deploy IAM user: SSM + S3 downloads)

on:
  workflow_dispatch:

jobs:
  deploy-worker-production:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Build Cloudflare worker (SSR pages + API)
        run: npx noego build --target cloudflare --nodejs-compat

      # Migrate the PROD Postgres before deploying. Worker owns only the
      # durable set (proper.durable.json); relay is Node-only. `proper up`
      # is idempotent and exits 1 on error, stopping the deploy.
      - name: Migrate database (durable)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx proper -c proper.durable.json status
          npx proper -c proper.durable.json up

      # App secrets: SSM (us-east-1, /kazibee_web/prod/...) is the source of
      # truth; scripts/sync-secrets-from-ssm.sh copies them into the GitHub
      # `production` environment. Deploys read only GitHub secrets — no AWS
      # lookups at deploy time.
      - name: "Deploy with wrangler (env: production)"
        uses: cloudflare/wrangler-action@v3
        # --env production on the command selects the [env.production]
        # wrangler section (worker `kazibee`, kazibee.com); the separate
        # `environment: production` input scopes the `wrangler secret put`
        # calls so the secrets below land on the production worker, not dev.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dist/cloudflare
          environment: production
          command: deploy --env production
          secrets: |
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            DATABASE_URL
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
