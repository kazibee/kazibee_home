name: Deploy Worker Production (Cloudflare)

# Production deploy of the SAME artifact discipline as deploy-worker.yml
# (dev): build once with `noego build --target cloudflare`, then deploy the
# wrangler [env.production] section (worker `kazibee`, kazibee.com custom
# domain) generated from deploy.cloudflare.environments.production in
# noego.config.yml.
#
# Manual-only (`workflow_dispatch`) until the VM deploy (deploy.yml) is
# retired and prod cutover is verified; then add the `release` push
# trigger and delete deploy.yml.
#
# Requires @noego/app >= 2.1.6 (self-contained [env.<name>] sections in
# the generated wrangler.toml; earlier versions relied on wrangler
# inheritance that does not exist and shipped broken prod deploys).
#
# Required configuration (GitHub `production` environment):
#   CLOUDFLARE_API_TOKEN   — environment secret (Workers deploy, prod)
#   DATABASE_URL           — environment secret: prod Postgres, used by the
#                            migrate step (runner must reach it) and
#                            uploaded as a Worker secret
#   CLOUDFLARE_ACCOUNT_ID  — repository secret (account binding lives in
#                            CI, not in noego.config.yml)
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — repository secrets
#                            (kazibee_deploy IAM user: SSM + S3 downloads)
#   KAZIBEE_INTERNAL_NPM_TOKEN — read-only registry.kazibee.com token for
#                            @kazibee-internal/* (npm ci). Job-temporary:
#                            written to a $RUNNER_TEMP userconfig, removed
#                            before any wrangler step, always cleaned up.

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  deploy-worker-production:
    runs-on: self-hosted
    environment: production
    env:
      NPM_INTERNAL_AUTH_FILE: ${{ runner.temp }}/npm-internal-auth.npmrc
      NPM_NO_AUTH_FILE: ${{ runner.temp }}/npm-no-auth.npmrc

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gate on internal registry credential
        env:
          KAZIBEE_INTERNAL_NPM_TOKEN: ${{ secrets.KAZIBEE_INTERNAL_NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KAZIBEE_INTERNAL_NPM_TOKEN:-}" ]; then
            echo "::error::KAZIBEE_INTERNAL_NPM_TOKEN is not set for environment 'production'; cannot install @kazibee-internal/* packages"
            exit 1
          fi

      # Scope-only auth in an isolated userconfig: the public registry stays
      # unauthenticated and the repo .npmrc keeps the scope mapping.
      - name: Configure job-temporary npm auth (scope only)
        env:
          KAZIBEE_INTERNAL_NPM_TOKEN: ${{ secrets.KAZIBEE_INTERNAL_NPM_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          rm -f "$NPM_INTERNAL_AUTH_FILE" "$NPM_NO_AUTH_FILE"
          printf '%s\n' \
            '@kazibee-internal:registry=https://registry.kazibee.com/' \
            "//registry.kazibee.com/:_authToken=${KAZIBEE_INTERNAL_NPM_TOKEN}" \
            > "$NPM_INTERNAL_AUTH_FILE"
          : > "$NPM_NO_AUTH_FILE"
          echo "NPM_CONFIG_USERCONFIG=$NPM_INTERNAL_AUTH_FILE" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Remove registry auth before build and deploy
        if: always()
        run: |
          set -euo pipefail
          rm -f "$NPM_INTERNAL_AUTH_FILE"
          echo "NPM_CONFIG_USERCONFIG=$NPM_NO_AUTH_FILE" >> "$GITHUB_ENV"

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Build Cloudflare worker (SSR pages + API)
        run: npx noego build --target cloudflare --nodejs-compat

      # Migrations are NOT run here: they are manual-only via the
      # migrate-db-* workflows (workflow_dispatch). Deploys assume the
      # schema is already in place.

      # App secrets: SSM (us-east-1, /kazibee_web/prod/...) is the source of
      # truth; scripts/sync-secrets-from-ssm.sh copies them into the GitHub
      # `production` environment. Deploys read only GitHub secrets — no AWS
      # lookups at deploy time.
      - name: "Deploy with wrangler (env: production)"
        uses: cloudflare/wrangler-action@v3
        # --env production on the command selects the [env.production]
        # wrangler section (worker `kazibee`, kazibee.com); the separate
        # `environment: production` input scopes the `wrangler secret put`
        # calls so the secrets below land on the production worker, not dev.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SWARM_AWS_ACCESS_KEY_ID: ${{ secrets.SWARM_AWS_ACCESS_KEY_ID }}
          SWARM_AWS_SECRET_ACCESS_KEY: ${{ secrets.SWARM_AWS_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dist/cloudflare
          environment: production
          command: deploy --env production
          secrets: |
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            SWARM_AWS_ACCESS_KEY_ID
            SWARM_AWS_SECRET_ACCESS_KEY
            DATABASE_URL
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET

      - name: Cleanup npm auth files
        if: always()
        run: rm -f "$NPM_INTERNAL_AUTH_FILE" "$NPM_NO_AUTH_FILE"
