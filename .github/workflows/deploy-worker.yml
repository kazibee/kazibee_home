name: Deploy Worker (Cloudflare)

# Same release discipline as deploy.yml (Docker/Node prod): pushing the
# `release` branch deploys; `workflow_dispatch` allows manual deploys
# from any ref. Dev never runs here — local dev is `noego serve` (Node)
# or `wrangler dev` (workerd) against .dev.vars.
#
# RUNNER: self-hosted. Register one on the machine that hosts the
# noego_manager checkout (repo Settings → Actions → Runners → New
# self-hosted runner), and set NOEGO_MANAGER=/path/to/noego_manager in
# the runner's env (.env file in the runner directory). The workspace
# link step below then makes the file:../../noego/* framework deps
# resolve exactly like the local layout — no npm publish required.
# When the packages are published and package.json pins versions, the
# link step becomes a no-op and this can move back to ubuntu-latest.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN   — environment secret on `dev` (Workers deploy)
#   CLOUDFLARE_ACCOUNT_ID  — repository secret
# One-time runtime secret (per environment):
#   wrangler secret put DATABASE_URL   (worker Postgres; Hyperdrive later)

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: self-hosted
    # CLOUDFLARE_API_TOKEN lives as an ENVIRONMENT secret (GitHub
    # Environments are the dev/prod boundary): jobs only receive
    # environment secrets when they declare the environment. `dev` for
    # now; a `production` environment (own token + protection rules) can
    # gate the release-branch deploy later.
    environment: dev

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Link framework workspace
        # file:../../noego/* deps resolve two directories above the
        # checkout — mirror the meta-repo layout with one symlink when
        # the runner provides NOEGO_MANAGER. No-op otherwise (published
        # packages path).
        run: |
          if [ -n "${NOEGO_MANAGER:-}" ] && [ -d "$NOEGO_MANAGER/noego" ]; then
            ln -sfn "$NOEGO_MANAGER/noego" "$GITHUB_WORKSPACE/../../noego"
            echo "Linked $GITHUB_WORKSPACE/../../noego -> $NOEGO_MANAGER/noego"
          else
            echo "NOEGO_MANAGER not set; expecting published framework packages."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare worker
        # Backend-only until the frontend is ported off the legacy bridge
        # onto the v1 SSR pipeline; then this flag drops.
        run: npx noego build --target cloudflare --nodejs-compat --backend-only

      - name: Deploy with wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dist/cloudflare
          command: deploy
