name: Deploy Worker (Cloudflare)

# Same release discipline as deploy.yml (Docker/Node prod): pushing the
# `release` branch deploys; `workflow_dispatch` allows manual deploys
# from any ref. Dev never runs here — local dev is `noego serve` (Node)
# or `wrangler dev` (workerd) against .dev.vars.
#
# RUNNER: self-hosted (all noego/kazibee Actions run on the "simona"
# machine). Framework packages (@noego/app, @noego/dinner, @noego/forge,
# sqlstack) are pinned registry versions in package.json, so a plain
# npm ci is enough — no workspace linking, no NOEGO_MANAGER env needed.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN   — environment secret on `dev` (Workers deploy)
#   CLOUDFLARE_ACCOUNT_ID  — repository secret
# One-time runtime secret (per environment):
#   wrangler secret put DATABASE_URL   (worker Postgres; Hyperdrive later)

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: self-hosted
    # CLOUDFLARE_API_TOKEN lives as an ENVIRONMENT secret (GitHub
    # Environments are the dev/prod boundary): jobs only receive
    # environment secrets when they declare the environment. `dev` for
    # now; a `production` environment (own token + protection rules) can
    # gate the release-branch deploy later.
    environment: dev

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Build Cloudflare worker (SSR pages + API)
        run: npx noego build --target cloudflare --nodejs-compat

      # App secrets live in AWS SSM Parameter Store (account 083123597636,
      # us-east-1, SecureString) under /kazibee/<env>/... — the deploy IAM
      # user (kazibee_deploy) is the only AWS identity kazibee uses. Pull
      # them here and hand them to wrangler as Worker secrets below.
      - name: Load app secrets from SSM
        id: ssm
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          SSM_PREFIX: /kazibee/dev
        run: |
          get() { aws ssm get-parameter --name "$SSM_PREFIX/$1" --with-decryption --query Parameter.Value --output text; }
          GOOGLE_CLIENT_ID=$(get google/client_id)
          GOOGLE_CLIENT_SECRET=$(get google/client_secret)
          echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          {
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Deploy with wrangler
        uses: cloudflare/wrangler-action@v3
        # Runtime secrets live in the Cloudflare secret store; the action
        # uploads them right after the deploy:
        #   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY -> S3 downloads bucket (kazibee_deploy)
        #   DATABASE_URL -> worker Postgres (environment secret on `dev`)
        #   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET -> from SSM (step above)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dist/cloudflare
          command: deploy
          secrets: |
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            DATABASE_URL
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
