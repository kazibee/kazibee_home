name: Migrate Database Production

# Database migrations are MANUAL ONLY — never run on a push. A human
# dispatches this before (or independently of) a deploy. Deploy workflows do
# not migrate; they assume the schema is already in place.
#
# Runs both Postgres migration sets against the prod database:
#   proper.durable.json — worker-owned tables (connect, remote tools, auth)
#   proper.relay.json   — node relay tables
#
# Required configuration (GitHub `production` environment):
#   DATABASE_URL — prod Postgres, reachable from the self-hosted runner
#   KAZIBEE_INTERNAL_NPM_TOKEN — read-only registry.kazibee.com token for
#     @kazibee-internal/* (npm ci). Job-temporary: written to a $RUNNER_TEMP
#     userconfig, removed before the migrate steps, always cleaned up.

on:
  workflow_dispatch:

jobs:
  migrate-production:
    runs-on: self-hosted
    environment: production
    env:
      NPM_INTERNAL_AUTH_FILE: ${{ runner.temp }}/npm-internal-auth.npmrc
      NPM_NO_AUTH_FILE: ${{ runner.temp }}/npm-no-auth.npmrc

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gate on internal registry credential
        env:
          KAZIBEE_INTERNAL_NPM_TOKEN: ${{ secrets.KAZIBEE_INTERNAL_NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KAZIBEE_INTERNAL_NPM_TOKEN:-}" ]; then
            echo "::error::KAZIBEE_INTERNAL_NPM_TOKEN is not set for environment 'production'; cannot install @kazibee-internal/* packages"
            exit 1
          fi

      # Scope-only auth in an isolated userconfig: the public registry stays
      # unauthenticated and the repo .npmrc keeps the scope mapping.
      - name: Configure job-temporary npm auth (scope only)
        env:
          KAZIBEE_INTERNAL_NPM_TOKEN: ${{ secrets.KAZIBEE_INTERNAL_NPM_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          rm -f "$NPM_INTERNAL_AUTH_FILE" "$NPM_NO_AUTH_FILE"
          printf '%s\n' \
            '@kazibee-internal:registry=https://registry.kazibee.com/' \
            "//registry.kazibee.com/:_authToken=${KAZIBEE_INTERNAL_NPM_TOKEN}" \
            > "$NPM_INTERNAL_AUTH_FILE"
          : > "$NPM_NO_AUTH_FILE"
          echo "NPM_CONFIG_USERCONFIG=$NPM_INTERNAL_AUTH_FILE" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Remove registry auth before migrations
        if: always()
        run: |
          set -euo pipefail
          rm -f "$NPM_INTERNAL_AUTH_FILE"
          echo "NPM_CONFIG_USERCONFIG=$NPM_NO_AUTH_FILE" >> "$GITHUB_ENV"

      - name: Migrate (durable)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx proper -c proper.durable.json status
          npx proper -c proper.durable.json up

      - name: Migrate (relay)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx proper -c proper.relay.json status
          npx proper -c proper.relay.json up

      - name: Cleanup npm auth files
        if: always()
        run: rm -f "$NPM_INTERNAL_AUTH_FILE" "$NPM_NO_AUTH_FILE"
