name: Terraform Swarm Infra

# Infra changes are deliberate: PRs get fmt/validate/plan (plan posted as a
# comment); apply is workflow_dispatch only, never on push.
#
# There is ONE root (infra/terraform/envs/shared) that owns both the dev and
# prod SSM trees (Environment Separation doc, Option B), so every plan/apply
# runs under the `production` GitHub environment.
#
# RUNNER: self-hosted ("simona"), same as the deploy workflows.
#
# Required `production` environment secrets:
#   TERRAFORM_AWS_ACCESS_KEY_ID / TERRAFORM_AWS_SECRET_ACCESS_KEY — dedicated
#   infra_deploy_kazibee user. Do not reuse the Worker deployment's AWS credentials.

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-swarm.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"
      - name: terraform fmt -check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

  plan:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: self-hosted
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_AWS_SECRET_ACCESS_KEY }}
    defaults:
      run:
        working-directory: infra/terraform/envs/shared
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"
      - run: terraform init
      - run: terraform validate
      - name: terraform plan
        id: plan
        run: terraform plan -var-file=shared.tfvars -no-color -out=tfplan 2>&1 | tee plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/envs/shared/plan.txt', 'utf8');
            const body = `### Terraform plan — \`swarm/shared\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_AWS_SECRET_ACCESS_KEY }}
    defaults:
      run:
        working-directory: infra/terraform/envs/shared
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -var-file=shared.tfvars -out=tfplan
      - run: terraform apply -auto-approve tfplan
