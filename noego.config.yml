version: 1
root: .
output: dist
target: node

development:
  port: 3000

server:
  main: src/server/server.ts
  controllers: src/server/controller
  middleware: src/middleware
  openapi: src/server/stitch.yaml
  # Re-exported from the generated worker entry (cloudflare builds only):
  # Durable Object classes must be named exports of wrangler's main module.
  workerExports: src/server/durable-objects.ts

client:
  main: src/ui/main.ts
  shell: src/ui/index.html
  openapi: src/ui/stitch.yaml
  components: src/ui

assets:
  - src/ui/resources/images/**
  - src/ui/resources/**
  - migrations/**/*.sql

# Non-secret deploy metadata; secrets live in the Cloudflare secret
# store (wrangler secret put) and GitHub Environments, never here.
# Account binding is CI-owned too: set CLOUDFLARE_ACCOUNT_ID in the
# environment (wrangler-action accountId input / shell export).
deploy:
  cloudflare:
    # Shared settings only at this level (e.g. accountId) — nothing
    # deployable here. Every deployment, including dev, is a named
    # environment below; the generator (@noego/app >= 2.1.6) merges
    # shared + env settings into one fully self-contained wrangler
    # [env.<name>] section per env. The generated toml still carries a
    # top-level placeholder section (wrangler requires a top-level
    # name) — never deploy it; always `wrangler deploy --env <name>`.
    #
    # Raw wrangler fragment merged into every [env.*] section. The
    # ExecutorCoordinator Durable Object owns the single active Connect
    # channel per executor; the MCP satellite worker binds this same class
    # by script_name rather than declaring its own.
    wrangler:
      durable_objects:
        bindings:
          - name: EXECUTOR_COORDINATOR
            class_name: ExecutorCoordinator
          - name: SWARM_MACHINE_COORDINATOR
            class_name: SwarmMachineCoordinator
      migrations:
        - tag: v1
          new_sqlite_classes: [ExecutorCoordinator]
        - tag: v2
          new_sqlite_classes: [SwarmMachineCoordinator]
    environments:
      dev:
        name: kazibee-dev
        routes:
          - pattern: dev.kazibee.com
            customDomain: true
        wrangler:
          vars:
            # Claim links printed by executors: ${base}/claim/:claimId maps
            # onto the website's /connect/claim/:claimId page.
            KAZI_CONNECT_ACCOUNT_URL: https://dev.kazibee.com/connect
            # OAuth origins are deployment-pinned: issuer strings must be
            # byte-stable per environment (clients cache AS metadata).
            KAZI_MCP_ORIGIN: https://mcp-dev.kazibee.com
            KAZI_AGENT_ORIGIN: https://agent-dev.kazibee.com
            KAZI_WEBSITE_ORIGIN: https://dev.kazibee.com
            KAZI_SWARM_ENV: dev
      production:
        name: kazibee
        routes:
          - pattern: kazibee.com
            customDomain: true
        wrangler:
          vars:
            KAZI_CONNECT_ACCOUNT_URL: https://kazibee.com/connect
            KAZI_MCP_ORIGIN: https://mcp.kazibee.com
            KAZI_AGENT_ORIGIN: https://agent.kazibee.com
            KAZI_WEBSITE_ORIGIN: https://kazibee.com
            KAZI_SWARM_ENV: prod
