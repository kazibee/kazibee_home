version: 1
root: .
output: dist
target: node

development:
  port: 3000

server:
  main: src/server/server.ts
  controllers: src/server/controller
  middleware: src/middleware
  openapi: src/server/stitch.yaml

client:
  main: src/ui/frontend.ts
  shell: src/ui/index.html
  openapi: src/ui/stitch.yaml
  components: src/ui

assets:
  - src/ui/resources/images/**
  - src/ui/resources/**
  - migrations/**/*.sql

# Non-secret deploy metadata; secrets live in the Cloudflare secret
# store (wrangler secret put) and GitHub Environments, never here.
deploy:
  cloudflare:
    # dev.kazibee.com serves the FULL site (pages + API) from the worker.
    # Until the frontend is ported off the legacy bridge onto the v1 SSR
    # pipeline, worker builds are --backend-only and page routes 404.
    name: kazibee-dev
    accountId: f2d8e579cb41cb1aa6a8aaa264222eaf
    routes:
      - pattern: dev.kazibee.com
        customDomain: true
