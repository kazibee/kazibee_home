version: 1
root: .
output: dist
target: node

development:
  port: 3000

server:
  main: src/server/server.ts
  controllers: src/server/controller
  middleware: src/middleware
  openapi: src/server/stitch.yaml

client:
  main: src/ui/main.ts
  shell: src/ui/index.html
  openapi: src/ui/stitch.yaml
  components: src/ui

assets:
  - src/ui/resources/images/**
  - src/ui/resources/**
  - migrations/**/*.sql

# Non-secret deploy metadata; secrets live in the Cloudflare secret
# store (wrangler secret put) and GitHub Environments, never here.
# Account binding is CI-owned too: set CLOUDFLARE_ACCOUNT_ID in the
# environment (wrangler-action accountId input / shell export).
deploy:
  cloudflare:
    # Top level = the default (dev) environment: dev.kazibee.com serves
    # the FULL site (SSR pages + API) from the worker.
    name: kazibee-dev
    routes:
      - pattern: dev.kazibee.com
        customDomain: true
    # Named environments become wrangler [env.<name>] sections in the
    # generated dist/cloudflare/wrangler.toml (one build artifact; pick
    # the env at deploy time with `wrangler deploy --env <name>`).
    # name and routes are required per env — wrangler inherits top-level
    # routes otherwise, which would serve dev's routes.
    environments:
      production:
        name: kazibee
        routes:
          - pattern: kazibee.com
            customDomain: true
