module:
  connectAgentHandoffs:
    basePath: '/v1/connect/agent/handoffs'
    paths:
      '/':
        post:
          x-controller: connect_agent.controller
          x-action: createHandoff
          parameters:
            - in: cookie
              name: kazi_connect_session
              required: true
              schema: { type: string }
            - in: cookie
              name: kazi_connect_csrf
              required: true
              schema: { type: string }
            - in: header
              name: x-csrf-token
              required: true
              schema: { type: string }
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  additionalProperties: false
                  required: [executorId]
                  properties:
                    executorId: { type: string, pattern: '^exe_[A-Za-z0-9]{8,64}$' }
          responses:
            '201':
              description: Single-use Web Agent handoff
              content:
                application/json:
                  schema:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string, format: uri }
            '400': { description: Invalid executor }
            '401': { description: Session required }
            '403': { description: CSRF validation failed }
            '404': { description: Executor unavailable }
